# FormFit Supabase project config.
# Link a remote project: npx supabase link --project-ref <ref>

project_id = "formfit"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.migrations]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3001"]
enable_signup = true

[auth.email]
enabled = true
enable_confirmations = false

[analytics]
enabled = false
